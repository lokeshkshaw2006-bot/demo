<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPU Live</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="content" id="content"></main>
<script src="common.js"></script>
<script>
if(initLayout('lpulive')){
  let M=S.get('msgs',null);
  if(!M){M=[{from:'Dr. Anil Sharma',text:'Kal ki class 10 baje hogi. Assignment submit karna mat bhulna.',time:new Date().toISOString(),read:false}];S.set('msgs',M)}
  const INCOMING=[
    {from:'Prof. Neha Verma',text:'Project submission ki last date 2 din badh gayi hai.'},
    {from:'Rahul (Classmate)',text:'Bhai, kal ke notes bhej dena please.'},
    {from:'Ms. Simran Kaur',text:'Lab ke liye record file lana zaroori hai.'}
  ];
  $('#content').innerHTML=`
  <h1 class="page-title">🎥 LPU Live</h1><p class="sub">Official LPU Live par jao aur messages / notifications dekho</p>
  <div class="grid2">
    <div class="card">
      <h3>🔗 Official website</h3>
      <p class="sub">Button dabate hi aap LPU ke official site par chale jaoge.</p>
      <a class="btn" href="https://lpulive.lpu.in" target="_blank" rel="noopener">LPU Live kholo ↗</a>
      <hr>
      <h3>🔔 Notifications</h3>
      <p class="sub">Teacher ya student message kare to turant notification aaye.</p>
      <button class="btn ghost sm" id="perm">Browser notification ON karo</button>
      <button class="btn sm" id="demo">Demo: naya message aaya</button>
    </div>
    <div class="card">
      <h3>💬 Messages</h3>
      <div class="chat" id="chat"></div>
      <hr>
      <select id="to">${TEACHERS.map(t=>`<option>${t.name}</option>`).join('')}<option>Classmates</option></select>
      <textarea id="txt" rows="2" placeholder="Message likho..." style="margin-top:10px"></textarea>
      <button class="btn sm" id="send" style="margin-top:10px">Bhejo ➤</button>
    </div>
  </div>`;

  const chat=$('#chat');
  function draw(){
    chat.innerHTML=M.map(m=>`<div class="msg ${m.from==='me'?'me':''} ${m.read?'':'new'}"><b>${m.from==='me'?'Aap → '+esc(m.to||''):esc(m.from)}</b><br>${esc(m.text)}<small>${new Date(m.time).toLocaleString('en-IN')}</small></div>`).join('')||'<p class="sub">Koi message nahi</p>';
    chat.scrollTop=chat.scrollHeight;
  }
  draw();
  M.forEach(m=>m.read=true);S.set('msgs',M);

  $('#send').onclick=()=>{
    const t=$('#txt').value.trim();if(!t)return toast('Pehle message likho');
    M.push({from:'me',to:$('#to').value,text:t,time:new Date().toISOString(),read:true});
    S.set('msgs',M);$('#txt').value='';draw();toast('Message bhej diya ✅');
  };
  $('#demo').onclick=()=>{
    const d=INCOMING[Math.floor(Math.random()*INCOMING.length)];
    M.push({...d,time:new Date().toISOString(),read:false});S.set('msgs',M);draw();
    notify(d.from,d.text);
  };
  $('#perm').onclick=async()=>{
    if(!('Notification' in window))return toast('Aapka browser notifications support nahi karta');
    const r=await Notification.requestPermission();
    toast(r==='granted'?'Notifications ON ✅':'Permission nahi mili');
  };
}
</script>
</body>
</html>
